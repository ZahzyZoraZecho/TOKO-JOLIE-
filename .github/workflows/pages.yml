name: Deploy JOLIE to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://izbnbqjrmrslcqxoyzse.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6Ym5icWpybXJzbGNxeG95enNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDMxNDIsImV4cCI6MjEwNTYxOTE0Mn0.jf9-Nm421heB__fd2hVZ7at86RtxzHYYzV_AT_JFtEM
      - name: Prepare SPA fallback for direct routes
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
