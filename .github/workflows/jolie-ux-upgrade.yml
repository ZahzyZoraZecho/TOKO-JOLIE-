name: JOLIE Application UX Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jolie-ux-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[jolie-ux-upgrade]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Upgrade Business OS operation navigation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/BusinessApps.jsx")
          s = p.read_text()

          old = 'const allowed=(ROLE_APPS[access.role]||[]).includes(appId);'
          new = 'const allowed=appId==="launcher" || (ROLE_APPS[access.role]||[]).includes(appId);'
          if old in s:
              s=s.replace(old,new,1)

          old = '''function OperationGuide({appId}){const master=["commerce","procurement","crm","accounting","seo"].includes(appId);const workflow=["sales","finance","warehouse","alerts"].includes(appId);const navigate=(op)=>{window.dispatchEvent(new CustomEvent("jolie-operation",{detail:{appId,op}}));const el=document.querySelector(".biz-app-main");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});};return <div className="operation-guide" role="toolbar" aria-label="Operasi data"><b>Operasi</b><button onClick={()=>navigate("view")}>Daftar / Detail</button>{master&&<><button onClick={()=>navigate("insert")}>＋ Insert</button><button onClick={()=>navigate("update")}>✎ Update</button><button onClick={()=>navigate("delete")}>⌫ Delete</button></>}{workflow&&<><button onClick={()=>navigate("insert")}>＋ Insert / Proses</button><button onClick={()=>navigate("update")}>✎ Update Status</button><button onClick={()=>navigate("delete")}>Void / Cancel / Adjustment</button></>}{appId==="finance"&&<button onClick={()=>navigate("audit")}>Audit Trail</button>}{appId==="reports"&&<button onClick={()=>window.print()}>Cetak / Export</button>}{appId==="ai"&&<button onClick={()=>navigate("query")}>AI Query</button>}<button onClick={()=>window.location.reload()}>↻ Refresh</button></div>}'''
          new = '''function OperationGuide({appId}){const navigate=(op)=>{window.dispatchEvent(new CustomEvent("jolie-operation",{detail:{appId,op}}));const el=document.querySelector(".biz-app-main");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});};const readOnly=["reports","ai"].includes(appId);const safeDelete=["warehouse","sales","finance","alerts"].includes(appId);return <div className="operation-guide" role="toolbar" aria-label="Navigasi operasi aplikasi"><b>Operasi</b><button onClick={()=>navigate("view")}>▦ Daftar / Detail</button>{!readOnly&&<><button onClick={()=>navigate("insert")}>＋ Insert / Tambah</button><button onClick={()=>navigate("update")}>✎ Update / Edit</button>{!safeDelete&&<button onClick={()=>navigate("delete")}>⌫ Delete / Hapus</button>}{safeDelete&&<button onClick={()=>navigate("delete")}>↩ Void / Cancel / Adjustment</button>}</>}{appId==="reports"&&<button onClick={()=>window.print()}>Cetak / Export</button>}{appId==="ai"&&<button onClick={()=>navigate("query")}>AI Query</button>}<button onClick={()=>window.location.reload()}>↻ Refresh</button></div>}'''
          if old in s:
              s=s.replace(old,new,1)

          old = ''' const spec=cfg[appId]; if(!spec)return null;
 const [mode,setMode]=React.useState("view"),[editing,setEditing]=React.useState(null),[form,setForm]=React.useState(spec.defaults),[msg,setMsg]=React.useState(""),[busy,setBusy]=React.useState(false);'''
          new = ''' const spec=cfg[appId]; if(!spec)return null;
 const [mode,setMode]=React.useState("view"),[editing,setEditing]=React.useState(null),[form,setForm]=React.useState(spec.defaults),[msg,setMsg]=React.useState(""),[busy,setBusy]=React.useState(false);
 React.useEffect(()=>{const h=e=>{if(e.detail?.appId!==appId)return;const op=e.detail.op;if(op==="insert"){setEditing(null);setForm(spec.defaults);setMode("insert")}else if(op==="update"){setMode("update")}else if(op==="delete"){setMode("view");setMsg("Pilih baris yang akan dihapus dari daftar operasi.")}else if(op==="view"){setMode("view")}};window.addEventListener("jolie-operation",h);return()=>window.removeEventListener("jolie-operation",h)},[appId]);'''
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s)
          PY

      - name: Verify source
        run: |
          grep -q 'const allowed=appId==="launcher"' src/BusinessApps.jsx
          grep -q 'Insert / Tambah' src/BusinessApps.jsx
          grep -q 'jolie-operation' src/BusinessApps.jsx
          npm install
          npm run build

      - name: Commit upgrade
        run: |
          git config user.name "JOLIE Build Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BusinessApps.jsx
          git diff --cached --quiet || git commit -m "fix: make Business OS operational navigation consistent [jolie-ux-upgrade]"
          git push
